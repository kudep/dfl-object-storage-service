services:
  minio:
    image: minio/minio:latest
    container_name: dfl-minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: dfl-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: /init/init-minio.sh
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-videos}
      RECORDER_ACCESS_KEY: ${RECORDER_ACCESS_KEY:-recorder}
      RECORDER_SECRET_KEY: ${RECORDER_SECRET_KEY:-recorder-secret-change-me}
      TEACHER_ACCESS_KEY: ${TEACHER_ACCESS_KEY:-teacher}
      TEACHER_SECRET_KEY: ${TEACHER_SECRET_KEY:-teacher-secret-change-me}
    volumes:
      - ./init/init-minio.sh:/init/init-minio.sh:ro
